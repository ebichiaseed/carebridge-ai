<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareBridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16202c;
    --muted: #455364;
    --brand: #14508c;
    --brand-dark: #0e3a68;
    --brand-tint: #e6eff8;
    --live: #a52218;
    --line: #c4cedb;
    --page: #eef2f7;
    --surface: #ffffff;
    --scale: 1;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: "Atkinson Hyperlegible", Verdana, sans-serif;
    font-size: calc(20px * var(--scale));
    line-height: 1.5;
  }

  .app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--surface);
    padding: 20px 20px 56px;
  }

  /* ---------- top bar ---------- */

  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding-bottom: 18px;
    border-bottom: 2px solid var(--line);
  }

  .bar h1 {
    font-size: calc(28px * var(--scale));
    margin: 0;
    letter-spacing: -0.01em;
  }

  .sizer { display: flex; gap: 8px; align-items: center; }

  .sizer span { font-size: calc(15px * var(--scale)); color: var(--muted); }

  .sizer button {
    width: 54px;
    height: 54px;
    border: 2px solid var(--line);
    background: var(--surface);
    border-radius: 12px;
    color: var(--ink);
    font-family: inherit;
    font-weight: 700;
  }

  .sizer button[aria-pressed="true"] {
    border-color: var(--brand);
    background: var(--brand-tint);
    color: var(--brand-dark);
  }

  .sizer button:nth-of-type(1) { font-size: 16px; }
  .sizer button:nth-of-type(2) { font-size: 21px; }
  .sizer button:nth-of-type(3) { font-size: 26px; }

  /* ---------- instruction ---------- */

  .lead {
    font-size: calc(26px * var(--scale));
    line-height: 1.35;
    margin: 32px 0 8px;
  }

  .lead-note {
    color: var(--muted);
    font-size: calc(18px * var(--scale));
    margin: 0 0 28px;
  }

  /* ---------- buttons ---------- */

  button { font-family: inherit; cursor: pointer; }

  button:focus-visible { outline: 4px solid var(--brand); outline-offset: 3px; }

  .big {
    width: 100%;
    min-height: 104px;
    border: none;
    border-radius: 18px;
    background: var(--brand);
    color: #fff;
    font-size: calc(24px * var(--scale));
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 18px;
  }

  .big:hover:not(:disabled) { background: var(--brand-dark); }
  .big:disabled { background: #8b98a8; cursor: not-allowed; }
  .big[data-live="true"] { background: var(--live); }

  .mic { width: 34px; height: 34px; flex: none; fill: currentColor; }
  .square { width: 26px; height: 26px; background: #fff; border-radius: 4px; flex: none; }

  .big[data-live="true"] .square { animation: beat 1.6s ease-in-out infinite; }
  @keyframes beat { 50% { opacity: .4; } }

  .plain {
    width: 100%;
    min-height: 76px;
    margin-top: 16px;
    background: var(--surface);
    border: 3px solid var(--brand);
    border-radius: 18px;
    color: var(--brand-dark);
    font-size: calc(20px * var(--scale));
    font-weight: 700;
    padding: 14px;
  }

  .plain:hover:not(:disabled) { background: var(--brand-tint); }
  .plain:disabled { border-color: var(--line); color: var(--muted); cursor: not-allowed; }

  /* ---------- recording ---------- */

  .timer {
    text-align: center;
    font-size: calc(40px * var(--scale));
    font-variant-numeric: tabular-nums;
    margin: 22px 0 0;
    color: var(--live);
    font-weight: 700;
  }

  /* ---------- waiting ---------- */

  .waiting {
    margin-top: 32px;
    padding: 28px 22px;
    background: var(--brand-tint);
    border-radius: 18px;
    text-align: center;
    font-size: calc(21px * var(--scale));
  }

  .bars { display: flex; justify-content: center; gap: 8px; margin-top: 18px; }

  .bars i {
    width: 12px; height: 34px;
    background: var(--brand);
    border-radius: 6px;
    animation: bounce 1.1s ease-in-out infinite;
  }

  .bars i:nth-child(2) { animation-delay: .15s; }
  .bars i:nth-child(3) { animation-delay: .3s; }
  .bars i:nth-child(4) { animation-delay: .45s; }

  @keyframes bounce { 0%, 100% { transform: scaleY(.45); } 50% { transform: scaleY(1); } }

  @media (prefers-reduced-motion: reduce) {
    .bars i, .big[data-live="true"] .square { animation: none; }
  }

  /* ---------- problem ---------- */

  .problem {
    margin-top: 32px;
    padding: 24px;
    border: 3px solid var(--live);
    border-radius: 18px;
    background: #fdf3f2;
    font-size: calc(20px * var(--scale));
  }

  .problem strong { display: block; margin-bottom: 8px; font-size: calc(23px * var(--scale)); }

  /* ---------- result ---------- */

  .result { margin-top: 32px; }

  .switch {
    display: flex;
    border: 3px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 22px;
  }

  .switch button {
    flex: 1;
    min-height: 70px;
    border: none;
    background: var(--surface);
    color: var(--muted);
    font-size: calc(18px * var(--scale));
    font-weight: 700;
    padding: 10px;
  }

  .switch button[aria-pressed="true"] { background: var(--brand); color: #fff; }

  .heard-label {
    font-size: calc(18px * var(--scale));
    color: var(--muted);
    margin: 0 0 10px;
  }

  .heard {
    border: 3px solid var(--line);
    border-radius: 18px;
    padding: 24px;
    font-size: calc(28px * var(--scale));
    line-height: 1.45;
    min-height: 140px;
  }

  .heard.empty { color: var(--muted); font-size: calc(21px * var(--scale)); }
  .heard.failed { border-color: var(--live); color: var(--live); font-size: calc(20px * var(--scale)); }

  .row { display: flex; gap: 14px; margin-top: 18px; }
  .row .plain { margin-top: 0; }

  @media (max-width: 460px) { .row { flex-direction: column; } }

  .ok {
    margin-top: 14px;
    color: var(--brand-dark);
    font-size: calc(18px * var(--scale));
    min-height: 1.5em;
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<main class="app">

  <div class="bar">
    <h1>CareBridge</h1>
    <div class="sizer">
      <span>Text size</span>
      <button type="button" data-size="1" aria-pressed="true" aria-label="Normal text">A</button>
      <button type="button" data-size="1.2" aria-pressed="false" aria-label="Large text">A</button>
      <button type="button" data-size="1.45" aria-pressed="false" aria-label="Extra large text">A</button>
    </div>
  </div>

  <section id="step-start">
    <p class="lead">Press the button, then speak.</p>
    <p class="lead-note">English, Singlish, Mandarin, Cantonese and Hokkien all work.</p>

    <button class="big" id="record" data-live="false">
      <svg class="mic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11Z"/></svg>
      <span id="recordLabel">Start speaking</span>
    </button>

    <p class="timer" id="timer" hidden>0:00</p>

    <button class="plain" id="pick">Use a recording saved on this device</button>
    <input type="file" id="file" accept="audio/*" hidden>
  </section>

  <section class="waiting" id="step-waiting" hidden aria-live="polite">
    <div>Writing down what you said.<br>This takes about half a minute.</div>
    <div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </section>

  <section class="problem" id="step-problem" hidden role="alert">
    <strong id="problemTitle">Something went wrong</strong>
    <span id="problemText"></span>
    <button class="plain" id="retry">Try again</button>
  </section>

  <section class="result" id="step-result" hidden>
    <div class="switch" id="switch" hidden role="group" aria-label="Choose a language"></div>

    <p class="heard-label">What we heard</p>
    <div class="heard" id="heard" aria-live="polite"></div>

    <div class="row">
      <button class="plain" id="speak">Read it aloud</button>
      <button class="plain" id="copy">Copy the words</button>
    </div>
    <p class="ok" id="ok" aria-live="polite"></p>

    <button class="big" id="again" style="margin-top:28px">
      <svg class="mic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11Z"/></svg>
      Speak again
    </button>
  </section>

</main>

<script>
const MODELS = {
  singlish_whisper:  { label: "English or Singlish", lang: "en-SG" },
  qwen_multilingual: { label: "Chinese or dialect",  lang: "zh-CN" },
};

const MIC_PATH = "M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11Z";

const el = (id) => document.getElementById(id);

const steps = {
  start:   el("step-start"),
  waiting: el("step-waiting"),
  problem: el("step-problem"),
  result:  el("step-result"),
};

let recorder = null, chunks = [], ticker = null, seconds = 0;
let candidates = [], chosen = 0, lastBlob = null, lastName = "";

/* ---------- text size ---------- */

document.querySelectorAll(".sizer button").forEach((button) => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".sizer button")
      .forEach((other) => other.setAttribute("aria-pressed", String(other === button)));
    document.documentElement.style.setProperty("--scale", button.dataset.size);
  });
});

/* ---------- screens ---------- */

function show(name) {
  Object.entries(steps).forEach(([key, node]) => { node.hidden = key !== name; });
}

function problem(title, message) {
  el("problemTitle").textContent = title;
  el("problemText").textContent = message;
  show("problem");
}

function micIcon() {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "mic");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("aria-hidden", "true");
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", MIC_PATH);
  svg.append(path);
  return svg;
}

function stopIcon() {
  const box = document.createElement("span");
  box.className = "square";
  return box;
}

/* ---------- recording ---------- */

el("record").addEventListener("click", async () => {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    problem(
      "This page cannot hear you",
      "The microphone is switched off for this page. Turn it on in your browser settings, or use a recording saved on this device."
    );
    return;
  }

  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = (event) => chunks.push(event.data);
  recorder.onstop = () => {
    stream.getTracks().forEach((track) => track.stop());
    clearInterval(ticker);
    el("timer").hidden = true;
    el("record").dataset.live = "false";
    el("recordLabel").textContent = "Start speaking";
    const marker = el("record").querySelector(".square");
    if (marker) marker.replaceWith(micIcon());
    send(new Blob(chunks, { type: "audio/webm" }), "recording.webm");
  };

  recorder.start();
  seconds = 0;
  el("timer").textContent = "0:00";
  el("timer").hidden = false;
  ticker = setInterval(() => {
    seconds += 1;
    el("timer").textContent = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
  }, 1000);

  el("record").dataset.live = "true";
  el("recordLabel").textContent = "I am done";
  el("record").querySelector(".mic").replaceWith(stopIcon());
});

/* ---------- file upload ---------- */

el("pick").addEventListener("click", () => el("file").click());

el("file").addEventListener("change", () => {
  const file = el("file").files[0];
  if (file) send(file, file.name);
  el("file").value = "";
});

/* ---------- backend ---------- */

async function send(blob, name) {
  lastBlob = blob;
  lastName = name;
  show("waiting");

  const body = new FormData();
  body.append("audio", blob, name);

  try {
    const response = await fetch("/api/transcribe", { method: "POST", body });
    if (!response.ok) {
      const detail = await response.json().catch(() => ({}));
      throw new Error(detail.detail || `The server replied with an error (${response.status}).`);
    }
    const data = await response.json();
    candidates = data.candidates || [];
    if (!candidates.length) throw new Error("Nothing came back from the server.");
    chosen = candidates.findIndex((candidate) => candidate.text);
    if (chosen < 0) chosen = 0;
    render();
  } catch (err) {
    problem("We could not write down what you said", err.message);
  }
}

el("retry").addEventListener("click", () => {
  if (lastBlob) send(lastBlob, lastName);
  else show("start");
});

el("again").addEventListener("click", () => {
  el("ok").textContent = "";
  show("start");
  el("record").focus();
});

/* ---------- results ---------- */

function render() {
  const box = el("switch");
  box.innerHTML = "";

  if (candidates.length > 1) {
    box.hidden = false;
    candidates.forEach((candidate, index) => {
      const meta = MODELS[candidate.model] || { label: candidate.model };
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = meta.label;
      button.setAttribute("aria-pressed", String(index === chosen));
      button.addEventListener("click", () => { chosen = index; render(); });
      box.append(button);
    });
  } else {
    box.hidden = true;
  }

  const current = candidates[chosen];
  const heard = el("heard");
  heard.className = "heard";

  if (current.error) {
    heard.classList.add("failed");
    heard.textContent = "This one did not work. Try the other language above, or speak again.";
  } else if (!current.text) {
    heard.classList.add("empty");
    heard.textContent = "Nothing was picked up. Try again, a little louder and closer to the microphone.";
  } else {
    heard.textContent = current.text;
  }

  el("speak").disabled = !current.text;
  el("copy").disabled = !current.text;
  el("ok").textContent = "";
  show("result");
}

/* ---------- read aloud, copy ---------- */

el("speak").addEventListener("click", () => {
  const current = candidates[chosen];
  if (!current || !current.text || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(current.text);
  utterance.lang = (MODELS[current.model] || {}).lang || "en-SG";
  utterance.rate = 0.85;
  window.speechSynthesis.speak(utterance);
  el("ok").textContent = "Reading it aloud.";
});

el("copy").addEventListener("click", async () => {
  const current = candidates[chosen];
  if (!current || !current.text) return;
  try {
    await navigator.clipboard.writeText(current.text);
    el("ok").textContent = "Copied.";
  } catch {
    el("ok").textContent = "Copying is blocked here. Select the words and copy them by hand.";
  }
});
</script>
</body>
</html>
